<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geo Area</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #d9dee5;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 20px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    #map { height: 520px; border-radius: 8px; cursor: crosshair; }
    @media (max-width: 820px) { #map { height: 400px; } }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #f1f3f6; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { filter: brightness(1.08); background: var(--accent); }
    h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    ol { margin: 0; padding-left: 22px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }
    .empty { color: var(--muted); font-size: .9rem; margin: 0; }
    .result { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 1.05rem; }
    .result.ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .result.warn { background: #fffbeb; border: 1px solid #fde68a; font-size: .95rem; }
    .result small { display: block; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Geo Area</h1>
    <p class="subtitle">Кликвайте върху картата, за да добавите върхове на многоъгълника. После натиснете „Изчисли площ“.</p>

    <div class="layout">
      <div class="card">
        <div id="map"></div>
      </div>

      <aside class="card">
        <div class="toolbar">
          <button id="calcBtn" class="primary">Изчисли площ</button>
          <button id="clearBtn">Изчисти</button>
          <button id="exampleBtn">Зареди примера</button>
        </div>

        <h2>Точки (latitude, longitude)</h2>
        <div id="pointList"></div>
        <div id="result"></div>
      </aside>
    </div>
  </main>

  <script>
    // ---------- Функцията от задачата (същата като в geo-area.js) ----------
    function calculateGeoArea(...coordinates) {
      const R = 6371000;
      const toRadians = (degrees) => (degrees * Math.PI) / 180;
      let sum = 0;
      for (let i = 0; i < coordinates.length; i++) {
        const p1 = coordinates[i];
        const p2 = coordinates[(i + 1) % coordinates.length];
        sum += toRadians(p2.longitude - p1.longitude) *
          (2 + Math.sin(toRadians(p1.latitude)) + Math.sin(toRadians(p2.latitude)));
      }
      const area = (Math.abs(sum) * R * R) / 2;
      return `Area: ${area.toFixed(2)} m²`;
    }

    // ---------- Карта (Leaflet + OpenStreetMap) ----------
    const map = L.map("map").setView([42.63625, 23.36967], 18);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);

    let coordinates = [];          // [{ latitude, longitude }, ...]
    const markersLayer = L.layerGroup().addTo(map);
    let shape = null;              // линия (1–2 точки) или полигон (3+ точки)

    const pointList = document.getElementById("pointList");
    const result = document.getElementById("result");

    function redraw() {
      markersLayer.clearLayers();
      if (shape) {
        map.removeLayer(shape);
        shape = null;
      }

      const latLngs = coordinates.map((c) => [c.latitude, c.longitude]);

      latLngs.forEach((latLng, index) => {
        L.circleMarker(latLng, { radius: 6, color: "#fff", weight: 2, fillColor: "#2563eb", fillOpacity: 1 })
          .bindTooltip(String(index + 1))
          .addTo(markersLayer);
      });

      if (latLngs.length >= 3) {
        shape = L.polygon(latLngs, { color: "#2563eb", weight: 2, fillOpacity: 0.15 }).addTo(map);
      } else if (latLngs.length === 2) {
        shape = L.polyline(latLngs, { color: "#2563eb", weight: 2, dashArray: "6 4" }).addTo(map);
      }

      // Списък с координатите
      if (coordinates.length === 0) {
        pointList.innerHTML = '<p class="empty">Още няма точки.</p>';
      } else {
        pointList.innerHTML = "<ol>" + coordinates
          .map((c) => `<li>${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}</li>`)
          .join("") + "</ol>";
      }
    }

    // Събитие click върху картата → нова точка
    map.on("click", (event) => {
      coordinates.push({ latitude: event.latlng.lat, longitude: event.latlng.lng });
      result.innerHTML = ""; // старият резултат вече не е актуален
      redraw();
    });

    document.getElementById("calcBtn").addEventListener("click", () => {
      if (coordinates.length < 3) {
        result.innerHTML = '<div class="result warn">Нужни са поне 3 точки, за да има площ.</div>';
        return;
      }
      const text = calculateGeoArea(...coordinates); // spread: масивът става отделни аргументи
      const squareMeters = parseFloat(text.replace("Area: ", ""));
      result.innerHTML =
        `<div class="result ok"><strong>${text}</strong>` +
        `<small>≈ ${(squareMeters / 1000).toFixed(2)} дка · ${(squareMeters / 10000).toFixed(4)} ха</small></div>`;
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      coordinates = [];
      result.innerHTML = "";
      redraw();
    });

    document.getElementById("exampleBtn").addEventListener("click", () => {
      coordinates = [
        { latitude: 42.635912, longitude: 23.369442 },
        { latitude: 42.635917, longitude: 23.369905 },
        { latitude: 42.636574, longitude: 23.369877 },
      ];
      result.innerHTML = "";
      redraw();
      map.fitBounds(coordinates.map((c) => [c.latitude, c.longitude]), { padding: [60, 60] });
    });

    redraw();
  </script>
</body>
</html>
