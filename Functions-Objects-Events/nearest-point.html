<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nearest Point</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #d9dee5;
      --accent: #2563eb;
      --userLoc: #dc2626;
      --nearest: #16a34a;
      --point: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 20px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    canvas { display: block; width: 100%; aspect-ratio: 1; cursor: crosshair; border-radius: 8px; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: .9rem; color: var(--muted); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
    button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #f1f3f6; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { filter: brightness(1.08); background: var(--accent); }
    h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    .row { display: grid; grid-template-columns: 14px 1fr 1fr 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
    .row input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      font-variant-numeric: tabular-nums;
    }
    .row button { padding: 4px 0; font-weight: 400; color: var(--muted); }
    .empty { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
    .result { margin-top: 14px; padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; font-size: .95rem; }
    .result code { font-weight: 700; }
    .section { margin-bottom: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Nearest Point</h1>
    <p class="subtitle">Първият клик задава локацията, всеки следващ добавя точка. Координатите могат да се редактират в списъка.</p>

    <div class="layout">
      <div class="card">
        <canvas id="plane" width="600" height="600"></canvas>
        <div class="legend">
          <span><span class="dot" style="background: var(--userLoc)"></span>Локация</span>
          <span><span class="dot" style="background: var(--nearest)"></span>Най-близка точка</span>
          <span><span class="dot" style="background: var(--point)"></span>Други точки</span>
        </div>
      </div>

      <aside class="card">
        <div class="toolbar">
          <button id="exampleBtn" class="primary">Зареди примера</button>
          <button id="clearBtn">Изчисти</button>
        </div>

        <div class="section">
          <h2>Локация (locX, locY)</h2>
          <div id="locationList"></div>
        </div>

        <div class="section">
          <h2>Точки (x, y)</h2>
          <div id="pointList"></div>
        </div>

        <div id="result"></div>
      </aside>
    </div>
  </main>

  <script>
    // ---------- Функцията от задачата (същата като в nearest-point.js) ----------
    function nearestPoint({ locX, locY }, ...points) {
      const distanceTo = (p) => Math.sqrt((p.x - locX) ** 2 + (p.y - locY) ** 2);
      let nearest = points[0];
      let minDistance = distanceTo(points[0]);
      for (const point of points) {
        const d = distanceTo(point);
        if (d < minDistance) {
          minDistance = d;
          nearest = point;
        }
      }
      return nearest;
    }

    // ---------- Състояние ----------
    let userLoc = null; // { locX, locY }
    let points = [];     // [{ x, y }, ...]

    const RANGE = 100; // координатите са от -100 до 100
    const COLORS = { userLoc: "#dc2626", nearest: "#16a34a", point: "#2563eb" };

    const canvas = document.getElementById("plane");
    const ctx = canvas.getContext("2d");
    const SIZE = canvas.width;

    // Превръщане между координати на равнината и пиксели на canvas
    const toPixelX = (x) => ((x + RANGE) / (2 * RANGE)) * SIZE;
    const toPixelY = (y) => ((RANGE - y) / (2 * RANGE)) * SIZE; // оста Y е обърната
    const toPlane = (px) => Math.round((px / SIZE) * 2 * RANGE - RANGE);

    // ---------- Рисуване ----------
    function drawGrid() {
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, SIZE, SIZE);

      for (let v = -RANGE; v <= RANGE; v += 10) {
        ctx.strokeStyle = v === 0 ? "#9aa5b1" : v % 50 === 0 ? "#dde2e8" : "#eef1f4";
        ctx.lineWidth = v === 0 ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(toPixelX(v), 0);
        ctx.lineTo(toPixelX(v), SIZE);
        ctx.moveTo(0, toPixelY(v));
        ctx.lineTo(SIZE, toPixelY(v));
        ctx.stroke();
      }

      // Надписи по осите на всеки 50
      ctx.fillStyle = "#7b8794";
      ctx.font = "12px system-ui, sans-serif";
      for (let v = -RANGE + 50; v < RANGE; v += 50) {
        if (v === 0) continue;
        ctx.fillText(v, toPixelX(v) + 3, toPixelY(0) - 4);
        ctx.fillText(v, toPixelX(0) + 4, toPixelY(v) - 4);
      }
      ctx.fillText("0", toPixelX(0) + 4, toPixelY(0) - 4);
    }

    function drawDot(x, y, color, radius, label) {
      ctx.beginPath();
      ctx.arc(toPixelX(x), toPixelY(y), radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#1f2933";
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillText(label, toPixelX(x) + radius + 4, toPixelY(y) - radius);
    }

    function draw() {
      drawGrid();
      const nearest = userLoc && points.length > 0 ? nearestPoint(userLoc, ...points) : null;

      // Пунктирна линия от локацията до най-близката точка
      if (nearest) {
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = COLORS.nearest;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toPixelX(userLoc.locX), toPixelY(userLoc.locY));
        ctx.lineTo(toPixelX(nearest.x), toPixelY(nearest.y));
        ctx.stroke();
        ctx.setLineDash([]);
      }

      for (const p of points) {
        const isNearest = p === nearest;
        drawDot(p.x, p.y, isNearest ? COLORS.nearest : COLORS.point, isNearest ? 8 : 6, `(${p.x}, ${p.y})`);
      }

      if (userLoc) {
        drawDot(userLoc.locX, userLoc.locY, COLORS.userLoc, 8, `(${userLoc.locX}, ${userLoc.locY})`);
      }

      showResult(nearest);
    }

    // ---------- Списък с текстови полета ----------
    function makeRow(color, valueA, valueB, onChange, onRemove) {
      const row = document.createElement("div");
      row.className = "row";

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = color;

      const inputA = document.createElement("input");
      const inputB = document.createElement("input");
      for (const [input, value] of [[inputA, valueA], [inputB, valueB]]) {
        input.type = "number";
        input.value = value;
        // Събитие input: при всяка промяна обновяваме данните и рисунката
        input.addEventListener("input", () => {
          const a = Number(inputA.value);
          const b = Number(inputB.value);
          if (inputA.value !== "" && inputB.value !== "" && !isNaN(a) && !isNaN(b)) {
            onChange(a, b);
            draw();
          }
        });
      }

      const remove = document.createElement("button");
      remove.textContent = "×";
      remove.title = "Премахни";
      remove.addEventListener("click", onRemove);

      row.append(dot, inputA, inputB, remove);
      return row;
    }

    function renderLists() {
      const locationList = document.getElementById("locationList");
      const pointList = document.getElementById("pointList");
      locationList.innerHTML = "";
      pointList.innerHTML = "";

      if (userLoc) {
        locationList.append(makeRow(
          COLORS.userLoc, userLoc.locX, userLoc.locY,
          (a, b) => { userLoc.locX = a; userLoc.locY = b; },
          () => { userLoc = null; update(); }
        ));
      } else {
        locationList.innerHTML = '<p class="empty">Кликнете върху равнината, за да зададете локация.</p>';
      }

      if (points.length === 0) {
        pointList.innerHTML = '<p class="empty">Още няма точки.</p>';
      }
      points.forEach((p, index) => {
        pointList.append(makeRow(
          COLORS.point, p.x, p.y,
          (a, b) => { p.x = a; p.y = b; },
          () => { points.splice(index, 1); update(); }
        ));
      });
    }

    function showResult(nearest) {
      const result = document.getElementById("result");
      if (!nearest) {
        result.innerHTML = "";
        return;
      }
      const d = Math.hypot(nearest.x - userLoc.locX, nearest.y - userLoc.locY);
      result.innerHTML =
        `<div class="result">Най-близка точка: <code>{ x: ${nearest.x}, y: ${nearest.y} }</code><br>` +
        `Разстояние: ${d.toFixed(2)}</div>`;
    }

    function update() {
      renderLists();
      draw();
    }

    // ---------- Събития ----------
    canvas.addEventListener("click", (event) => {
      // Мащабираме клика, защото canvas може да е показан по-малък от 600px
      const rect = canvas.getBoundingClientRect();
      const px = ((event.clientX - rect.left) / rect.width) * SIZE;
      const py = ((event.clientY - rect.top) / rect.height) * SIZE;
      const x = toPlane(px);
      const y = -toPlane(py);

      if (userLoc === null) {
        userLoc = { locX: x, locY: y }; // първият клик е локацията
      } else {
        points.push({ x, y });           // следващите са точки
      }
      update();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      userLoc = null;
      points = [];
      update();
    });

    document.getElementById("exampleBtn").addEventListener("click", () => {
      userLoc = { locX: 10, locY: 20 };
      points = [{ x: 25, y: 30 }, { x: -5, y: 20 }, { x: 70, y: -10 }, { x: 0, y: 50 }];
      update();
    });

    update();
  </script>
</body>
</html>
